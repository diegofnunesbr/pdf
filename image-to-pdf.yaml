apiVersion: v1
kind: Namespace
metadata:
  name: image-to-pdf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-to-pdf
  namespace: image-to-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-to-pdf
  template:
    metadata:
      labels:
        app: image-to-pdf
    spec:
      containers:
        - name: image-to-pdf
          image: image-to-pdf:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: image-to-pdf
  namespace: image-to-pdf
spec:
  type: ClusterIP
  selector:
    app: image-to-pdf
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-to-pdf
  namespace: image-to-pdf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - image-to-pdf.diegofnunesbr.com
      secretName: image-to-pdf-tls
  rules:
    - host: image-to-pdf.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: image-to-pdf
                port:
                  number: 8000
