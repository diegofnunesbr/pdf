<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23e53935' width='32' height='32' rx='4'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>PDF</text></svg>">
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,sans-serif;
background:#ffffff;
color:#1a1d24;
}
.login-screen{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
}
.login-card{
width:100%;
max-width:320px;
display:flex;
flex-direction:column;
gap:12px;
}
.login-card h1{
text-align:center;
margin:0 0 8px;
font-size:24px;
}
.login-card input{
padding:10px 12px;
border-radius:8px;
border:1px solid #d5d9e0;
background:#ffffff;
color:#1a1d24;
font-size:15px;
}
.login-card button{
padding:10px 12px;
border-radius:8px;
border:none;
background:#e53935;
color:white;
font-size:15px;
cursor:pointer;
}
.login-card button:hover{
background:#c62828;
}
.login-error{
color:#e0393e;
font-size:13px;
text-align:center;
margin:0;
}
</style>
</head>
<body>
<div class="login-screen">
<form class="login-card" method="post" action="/login">
<h1>PDF</h1>
<input name="username" type="text" placeholder="Usuário" autocomplete="username" required autofocus>
<input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
<button type="submit">Entrar</button>
__ERROR__
</form>
</div>
</body>
</html>
