apiVersion: v1
kind: Namespace
metadata:
  name: pdf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf
  namespace: pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf
  template:
    metadata:
      labels:
        app: pdf
    spec:
      containers:
        - name: pdf
          image: pdf:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pdf-auth-secrets
                  key: username
            - name: AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: pdf-auth-secrets
                  key: password-hash
            - name: TRUST_PROXY_HEADER
              value: X-Forwarded-Preferred-Username
            - name: PROXY_LOGOUT_URL
              value: "/oauth2/sign_out?rd=https%3A%2F%2Fkeycloak.diegofnunesbr.com%2Frealms%2Fhomelab%2Fprotocol%2Fopenid-connect%2Flogout%3Fid_token_hint%3D%7Bid_token%7D%26post_logout_redirect_uri%3Dhttps%3A%2F%2Fpdf.diegofnunesbr.com"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          imagePullPolicy: IfNotPresent

          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8000/
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.diegofnunesbr.com/realms/homelab
            - --redirect-url=https://pdf.diegofnunesbr.com/oauth2/callback
            - --scope=openid email profile
            - --email-domain=*
            - --allowed-group=pdf-users
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --cookie-secure=true
            - --whitelist-domain=keycloak.diegofnunesbr.com

          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: pdf

            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pdf-oidc
                  key: clientSecret

            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pdf-oidc
                  key: cookieSecret

          ports:
            - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: pdf
  namespace: pdf
spec:
  type: ClusterIP
  selector:
    app: pdf
  ports:
    - name: web
      port: 4180
      targetPort: 4180

    - name: direct
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdf
  namespace: pdf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pdf.diegofnunesbr.com
      secretName: pdf-tls
  rules:
    - host: pdf.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdf
                port:
                  number: 4180
