apiVersion: v1
kind: Namespace
metadata:
  name: pdf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf
  namespace: pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf
  template:
    metadata:
      labels:
        app: pdf
    spec:
      containers:
        - name: pdf
          image: pdf:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pdf-auth-secrets
                  key: username
            - name: AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: pdf-auth-secrets
                  key: password-hash
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pdf
  namespace: pdf
spec:
  type: ClusterIP
  selector:
    app: pdf
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdf
  namespace: pdf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pdf.diegofnunesbr.com
      secretName: pdf-tls
  rules:
    - host: pdf.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdf
                port:
                  number: 8000
